id: TEST-REGEX-001
name: "Toy Regex Matcher Test Rule"
version: "1.0"

metadata:
  author: "NextSploit Team"
  tags: [test, regex]

target:
  technology: [any]
  version: "*"
  requires: []

severity: info
confidence: 0.5

requests:
  - method: GET
    path: /
    headers: {}

match:
  all:
    - type: regex
      operator: regex
      location: body
      value: "hello|world|test"

remediation: "This is a test rule only."
