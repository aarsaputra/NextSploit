id: TEST-STATUS-001
name: "Toy Status Matcher Test Rule"
version: "1.0"

metadata:
  author: "NextSploit Team"
  tags: [test, status]

target:
  technology: [any]
  version: "*"
  requires: []

severity: info
confidence: 0.5

requests:
  - method: GET
    path: /
    headers: {}

match:
  all:
    - type: status
      operator: equals
      value: 200

remediation: "This is a test rule only."
